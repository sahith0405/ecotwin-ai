spring.application.name=ecotwin-backend

server.port=${PORT:8080}

app.cors.frontend-url=${FRONTEND_URL:}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecotwin}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sahith}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
